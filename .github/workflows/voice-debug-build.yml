name: Build debug APK (voice liked-songs test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository with core submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Apply voice liked-songs patch to core submodule
        run: git -C core apply ../patches/voice-liked-search.patch

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Use FOSS flavor (fail closed if flag is not FOSS)
        run: |
          sed -i 's/^isFullBuild=true/isFullBuild=false/' gradle.properties
          grep -qx 'isFullBuild=false' gradle.properties

      - name: Run unit tests
        run: ./gradlew :media3:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simpmusic-voice-debug-apk
          path: androidApp/build/outputs/apk/
          retention-days: 7
