name: Build reviewed 2.6.0 base, Zora and liked-sort updates
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant selection
        required: true
        default: both
        type: choice
        options: [both, base, voice, sort]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'voice' && '["voice"]' || inputs.variant == 'base' && '["base"]' || inputs.variant == 'sort' && '["sort"]' || inputs.variant == 'voicesort' && '["voicesort"]' || '["base","voice"]') }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Check out the dispatched commit (voice18 source tree + patch set)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned official update and personal variant
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/prepare-update.py" <<'PY'
          import pathlib, subprocess, re, os, json
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); out=root/'prepared'; variant=os.environ['VARIANT']
          assert variant in ['base','voice','sort','voicesort']
          out.mkdir(exist_ok=True)
          subprocess.run(['git','fetch','--no-tags','https://github.com/maxrave-dev/SimpMusic.git','140673ab2f2b83d5a2264d3a5f51f1dce3ab6b05'],check=True)
          with subprocess.Popen(['git','archive','140673ab2f2b83d5a2264d3a5f51f1dce3ab6b05'],stdout=subprocess.PIPE) as p:
           subprocess.run(['tar','-x','-C',str(out)],stdin=p.stdout,check=True); assert p.wait()==0
          subprocess.run(['git','clone','--filter=blob:none','--no-checkout','https://github.com/maxrave-dev/core.git',str(out/'core')],check=True)
          subprocess.run(['git','checkout','--detach','8413a257cbe45d102a9f101f2760e35b549e4d9e'],cwd=out/'core',check=True)
          # Same personal application ID and signing key for both alternative builds.
          p=out/'androidApp/build.gradle.kts';s=p.read_text();anchor='    buildTypes {'
          assert s.count(anchor)==1
          s=s.replace(anchor,'''    signingConfigs {
                  create("voiceTest") {
                      storeFile = System.getenv("SIGN_STORE_FILE")?.let { file(it) }
                      storePassword = System.getenv("SIGN_STORE_PASSWORD")
                      keyAlias = System.getenv("SIGN_KEY_ALIAS")
                      keyPassword = System.getenv("SIGN_KEY_PASSWORD")
                  }
              }
          '''+anchor)
          s=s.replace('            isShrinkResources = true','''            isShrinkResources = true
                      applicationIdSuffix = ".dev"
                      versionNameSuffix = "-'''+('base' if variant=='base' else ('sort' if variant=='sort' else ('zorasort' if variant=='voicesort' else 'zora')))+'''"
                      signingConfig = signingConfigs.getByName("voiceTest")''');p.write_text(s)
          p=out/'gradle/libs.versions.toml';s=p.read_text();assert 'version-code = "63"' in s;assert 'commonsIo = "2.5"' in s
          s=s.replace('version-code = "63"','version-code = "'+('66' if variant=='base' else ('68' if variant=='sort' else ('69' if variant=='voicesort' else '67')))+'"').replace('commonsIo = "2.5"','commonsIo = "2.22.0"');p.write_text(s)
          p=out/'gradle.properties';s=p.read_text().replace('isFullBuild=true','isFullBuild=false');assert 'isFullBuild=false' in s;p.write_text(s)
          # Preserve the existing personal-fork compatibility fix. No official signature is forged.
          p=out/'androidApp/src/main/java/com/maxrave/simpmusic/MainActivity.kt';s=p.read_text();line='        if (!BuildConfig.DEBUG) viewModel.checkOfficialBuild(packageName, signingCertSha256())\n';assert s.count(line)==1;s=s.replace(line,'');p.write_text(s)
          if variant in ('voice','voicesort'):
           # Exact existing voice18 changes, with only two moved resource/settings anchors adapted.
           files=['androidApp/src/main/AndroidManifest.xml','composeApp/src/androidMain/kotlin/com/maxrave/simpmusic/expect/ui/VoiceListening.android.kt','composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/expect/ui/VoiceListening.kt','composeApp/src/jvmMain/kotlin/com/maxrave/simpmusic/expect/ui/VoiceListening.jvm.kt']
           for f in files:
            src=root/f;dest=out/f;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(src.read_bytes())
           p=out/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/other/CreditScreen.kt';s=p.read_text();anchor='        // App description';assert s.count(anchor)==1
           s=s.replace(anchor,'        Text(text = stringResource(Res.string.voice_mod_credit), style = typo().bodyMedium)\n        Spacer(modifier = Modifier.height(20.dp))\n\n'+anchor);p.write_text(s)
           p=out/'composeApp/src/commonMain/composeResources/values/strings.xml';s=p.read_text();assert s.count('</resources>')==1
           s=s.replace('</resources>','    <string name="voice_listen_section">Voice listening</string>\n    <string name="voice_listen_title">Hands-free listening ("Hey Zora")</string>\n    <string name="voice_mod_credit">Voice-control modifications by Arhaan Ansari</string>\n</resources>');p.write_text(s)
           p=out/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt';s=p.read_text();anchor='import com.maxrave.simpmusic.expect.ui.LoginSyncDialog';assert s.count(anchor)==1;s=s.replace(anchor,'import com.maxrave.simpmusic.expect.ui.VoiceListeningSettingGroup\n'+anchor)
           anchor='        item(key = "discord") {';assert s.count(anchor)==1;s=s.replace(anchor,'        item(key = "voiceListening") {\n            VoiceListeningSettingGroup()\n        }\n'+anchor);p.write_text(s)
           # Explicit voice18 core patch list (self-contained; no longer regexed from any workflow text).
           paths=['patches/'+n for n in ['voice-liked-search.patch','voice-wakeword-listener.patch','voice-diagnostics.patch','voice-fixes.patch','voice-liked-import.patch','voice-matching-wake.patch','voice-wake-diagnostics.patch','voice-sherpa-wake.patch','voice-mic-health.patch','voice-command-cue.patch','voice-match-popularity.patch','voice-battery-lazy.patch','voice-clean-ui.patch','voice18-random-liked.patch']]  # exact voice18 apply order
           for f2 in paths:
            assert (root/f2).exists(), f2
            subprocess.run(['git','apply',str(root/f2)],cwd=out/'core',check=True)
           (out/'NOTICE-voice-listener.md').write_bytes((root/'NOTICE-voice-listener.md').read_bytes())
          if variant in ('sort','voicesort'):
           # Liked-sort update: liked-import patch (shared with voice) plus the autosort patch. No voice files.
           for f in ['patches/voice-liked-import.patch','patches/voice-liked-autosort.patch']:
            if variant=='voicesort' and f=='patches/voice-liked-import.patch': continue  # already in the voice set
            subprocess.run(['git','apply',str(root/f)],cwd=out/'core',check=True)
          # Adapt the existing voice18 liked-import fixture to upstream's new explicit sync dependency.
          if variant in ('voice','sort','voicesort'):
           p=out/'core/data/src/jvmTest/kotlin/com/maxrave/data/repository/ImportLikedRegressionTest.kt';s=p.read_text()
           anchor='LocalDataSource(dao, db)';assert s.count(anchor)==1
           s=s.replace(anchor,'''LocalDataSource(dao, db, com.maxrave.data.librarysync.SyncChangeRecorder(db.getSyncDao(),
                      com.maxrave.data.librarysync.SyncPrefs(object : androidx.datastore.core.DataStore<androidx.datastore.preferences.core.Preferences> {
                          private val state = kotlinx.coroutines.flow.MutableStateFlow(androidx.datastore.preferences.core.emptyPreferences())
                          override val data: kotlinx.coroutines.flow.Flow<androidx.datastore.preferences.core.Preferences> = state
                          override suspend fun updateData(transform: suspend (androidx.datastore.preferences.core.Preferences) -> androidx.datastore.preferences.core.Preferences): androidx.datastore.preferences.core.Preferences {
                              val updated = transform(state.value); state.value = updated; return updated
                          }
                      })))''');p.write_text(s)
          if variant in ('sort','voicesort'):
           # Liked-songs sorting UI: one-time sort button in Settings > Backup, result toasts, credit.
           p=out/'composeApp/src/commonMain/composeResources/values/strings.xml';s=p.read_text();assert s.count('</resources>')==1
           s=s.replace('</resources>','    <string name="liked_sort_title">Sort liked songs</string>\n    <string name="liked_sort_subtitle">File every liked song into the Phonk, English and Hindi playlists. New likes are sorted automatically.</string>\n    <string name="liked_sort_done">Liked songs sorted - %1$d added to the Phonk, English and Hindi playlists</string>\n    <string name="liked_sort_failed">Could not sort liked songs</string>\n    <string name="liked_sort_mod_credit">Liked-songs sorting by Arhaan Ansari</string>\n</resources>');p.write_text(s)
           p=out/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/home/SettingScreen.kt';s=p.read_text()
           anchor='import simpmusic.composeapp.generated.resources.import_data\n';assert s.count(anchor)==1
           s=s.replace(anchor,anchor+'import simpmusic.composeapp.generated.resources.liked_sort_subtitle\nimport simpmusic.composeapp.generated.resources.liked_sort_title\n')
           anchor='''                SettingItem(
                              title = stringResource(Res.string.import_data),
                              subtitle = stringResource(Res.string.import_playlists_from_other_apps),
                              onClick = {
                                  coroutineScope.launch {
                                      importLauncher.launch()
                                  }
                              },
                          )''';assert s.count(anchor)==1
           s=s.replace(anchor,anchor+'''
                          SettingItem(
                              title = stringResource(Res.string.liked_sort_title),
                              subtitle = stringResource(Res.string.liked_sort_subtitle),
                              onClick = {
                                  coroutineScope.launch {
                                      viewModel.sortLikedSongsIntoBuckets()
                                  }
                              },
                          )''');p.write_text(s)
           p=out/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/viewModel/SettingsViewModel.kt';s=p.read_text()
           anchor='import simpmusic.composeapp.generated.resources.backup_create_failed\n';assert s.count(anchor)==1
           s=s.replace(anchor,anchor+'import simpmusic.composeapp.generated.resources.liked_sort_done\nimport simpmusic.composeapp.generated.resources.liked_sort_failed\n')
           anchor='''    fun setBackupDownloaded(backupDownloaded: Boolean) {
                  viewModelScope.launch {
                      dataStoreManager.setBackupDownloaded(backupDownloaded)
                      getBackupDownloaded()
                  }
              }''';assert s.count(anchor)==1
           s=s.replace(anchor,anchor+'''

              /** One-time pass over the liked library into the Phonk / English / Hindi bucket playlists. */
              fun sortLikedSongsIntoBuckets() {
                  viewModelScope.launch {
                      runCatching { songRepository.sortAllLikedSongsIntoBuckets() }
                          .onSuccess { result ->
                              makeToast(
                                  formatString(
                                      Res.string.liked_sort_done,
                                      result.phonkAdded + result.englishAdded + result.hindiAdded,
                                  ),
                              )
                          }
                          .onFailure { makeToast(getString(Res.string.liked_sort_failed)) }
                  }
              }''');p.write_text(s)
           p=out/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/ui/screen/other/CreditScreen.kt';s=p.read_text();anchor='        // App description';assert s.count(anchor)==1
           s=s.replace(anchor,'        Text(text = stringResource(Res.string.liked_sort_mod_credit), style = typo().bodyMedium)\n        Spacer(modifier = Modifier.height(20.dp))\n\n'+anchor);p.write_text(s)
          # Upstream desktop-cookie test expected insertion order, but implementation intentionally sorts specificity.
          p=out/'core/data/src/jvmTest/kotlin/com/maxrave/data/browserlogin/BrowserCookieTest.kt';s=p.read_text()
          assert s.count('assertEquals("SAPISID=domain; music=include", result.cookie)')==1
          s=s.replace('assertEquals("SAPISID=domain; music=include", result.cookie)','assertEquals("music=include; SAPISID=domain", result.cookie)');p.write_text(s)
          # Corresponding source is delivered with each APK. Private song packs are not inputs.
          (out/'PERSONAL-UPDATE-NOTES.md').write_text('''# Personal SimpMusic 2.6.0 update
          Upstream source: maxrave-dev/SimpMusic 140673ab2f2b83d5a2264d3a5f51f1dce3ab6b05
          Core source: maxrave-dev/core 8413a257cbe45d102a9f101f2760e35b549e4d9e
          Variant: '''+variant+'''
          Update compatibility and dependency changes by Arhaan Ansari.
          Same personal .dev application ID and signing configuration; Commons IO 2.22.0.
          All upstream and third-party licences/credits retained. This is not an official signed release.
          The APKs are alternatives and cannot coexist under the same personal package. Installing both is not required. Base omits the custom hands-free pack. Base versionCode66 can update voice18; Zora versionCode67 can update either voice18 or base. Android will not install lower-code base66 over Zora67. Do not uninstall to bypass this; request a newer base build if switching back.
          Voice build retains voice18 behavior, not the previously held voice19 retry candidate.
          No user data is intentionally cleared. Back up externally before update. Actual phone testing remains necessary.
          Optional computer pairing stays unconfigured unless user sets it up; code-review concerns remain documented separately.
          ''')
          if variant in ('sort','voicesort'):
           note = 'Sort variant: liked-songs bucket playlists (Phonk / English / Hindi) with a one-time sort button in Settings and automatic sorting of new likes. No voice pack included.\n'
           if variant=='voicesort':
            note = 'Zora+Sort variant: the full Zora voice pack is kept exactly as in version 67, and liked-songs bucket playlists (Phonk / English / Hindi) are added with a one-time sort button in Settings and automatic sorting of new likes.\n'
           p=out/'PERSONAL-UPDATE-NOTES.md';p.write_text(p.read_text()+note)
          # Upstream JVM regression helper accepts null in its own tests, as production SyncChangeEntity does.
          p=out/'core/data/src/jvmTest/kotlin/com/maxrave/data/librarysync/SyncSupportTest.kt';s=p.read_text();assert s.count('value: String = ON')==1
          s=s.replace('value: String = ON','value: String? = ON');p.write_text(s)
          # Exercise Room's real generated 27->28 migration on a file created from the published v27 schema.
          schema=json.loads((out/'core/data/schemas/com.maxrave.data.db.MusicDatabase/27.json').read_text())['database']
          sql=[]
          for t in schema['entities']:
           sql.append(t['createSql'].replace('${TABLE_NAME}',t['tableName']))
           for idx in t.get('indices',[]):sql.append(idx['createSql'].replace('${TABLE_NAME}',t['tableName']).replace('${INDEX_NAME}',idx['name']))
          sql+=schema['setupQueries'];sql+=['PRAGMA user_version=27',"INSERT INTO song(videoId,duration,durationSeconds,isAvailable,isExplicit,likeStatus,title,videoType,liked,totalPlayTime,downloadState,favoriteAt,inLibrary) VALUES('migration-kept','3:00',180,1,0,'LIKE','Kept liked download','MUSIC',1,123,3,1700000000000,1)"]
          # Dollar escape is required in Kotlin normal strings; schema placeholders were replaced above.
          def kt(x):return json.dumps(x).replace('$','\\$')
          body='\n'.join('                db.execSQL('+kt(x)+')' for x in sql)
          test='''package com.maxrave.data.db
          import androidx.room.Room
          import androidx.sqlite.driver.bundled.BundledSQLiteDriver
          import androidx.sqlite.execSQL
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.runBlocking
          import java.nio.file.Files
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          class PersonalUpdateMigrationTest {
              @Test fun actualGenerated27To28KeepsLikedDownload() = runBlocking {
                  val folder=Files.createTempDirectory("simpmusic-migration-").toFile()
                  val file=folder.resolve("old27.db")
                  try {
                      BundledSQLiteDriver().open(file.absolutePath).use { db ->
          '''+body+'''
                      }
                      val upgraded=Room.databaseBuilder<MusicDatabase>(name=file.absolutePath)
                          .addTypeConverter(Converters()).setDriver(BundledSQLiteDriver())
                          .setQueryCoroutineContext(Dispatchers.IO).build()
                      try {
                          val song=assertNotNull(upgraded.getDatabaseDao().getSong("migration-kept"))
                          assertEquals("Kept liked download",song.title)
                          assertEquals(true,song.liked)
                          assertEquals(3,song.downloadState)
                          assertEquals(123L,song.totalPlayTime)
                      } finally { upgraded.close() }
                      BundledSQLiteDriver().open(file.absolutePath).use { db ->
                          db.prepare("PRAGMA user_version").use { row ->
                              check(row.step());assertEquals(28L,row.getLong(0))
                          }
                          db.prepare("PRAGMA integrity_check").use { row ->
                              check(row.step());assertEquals("ok",row.getText(0))
                          }
                      }
                  } finally { folder.deleteRecursively() }
              }
          }
          '''
          p=out/'core/data/src/jvmTest/kotlin/com/maxrave/data/db/PersonalUpdateMigrationTest.kt';p.parent.mkdir(parents=True,exist_ok=True);p.write_text(test)
          print('Prepared',variant,'with old-data migration regression test')
          PY
          python "$RUNNER_TEMP/prepare-update.py"
      - name: Verify old signing certificate before any build
        env:
          KEYSTORE_B64: ${{ secrets.VOICE_SIGN_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.VOICE_SIGN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOICE_SIGN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voice-test.keystore"
          test -s "$RUNNER_TEMP/voice-test.keystore"
          keytool -exportcert -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/voice-test.keystore" -storepass:env STORE_PASS -file "$RUNNER_TEMP/voice-cert.der"
          echo "65e4f2d45b70c95b1ea21e647e52a0a9153b5f7723771db30ae54feb65388c9f  $RUNNER_TEMP/voice-cert.der" | sha256sum -c -
      - name: Fetch sherpa-onnx v2.0.1 Kotlin API, arm64 libs and KWS model (every file sha256-verified)
        if: matrix.variant == 'voice' || matrix.variant == 'voicesort'
        working-directory: prepared
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/sherpa"; mkdir -p "$T"
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          RAW=https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v2.0.1/sherpa-onnx/kotlin-api
          M=core/media/media3/src/main
          # Kotlin/JNI API sources (unmodified, Apache-2.0)
          mkdir -p "$M/java/com/k2fsa/sherpa/onnx"
          while read -r sum name; do
            curl -fsSL "$RAW/$name" -o "$M/java/com/k2fsa/sherpa/onnx/$name"
            echo "$sum  $M/java/com/k2fsa/sherpa/onnx/$name" | sha256sum -c -
          done <<'LIST'
          6d8387534b942a979424a1d6721fd285f85df8bfca0ea392860f11fe06f31d06 KeywordSpotter.kt
          3204ff816361d99d94dda1e8c26681f6d4a5ad749a68d8fee93b4e8bb2b21d17 OnlineRecognizer.kt
          6b9f8de317e6a0bb51f0f29d940617b781cb31b190e1c725dd438231836c06ab OnlineStream.kt
          829c7adc4db1324f21b9a9cbf5bf10eacf759714fe50956f48317c1ffef044f6 FeatureConfig.kt
          fe926b6413f4d87e67c41feb21b8363923a67cbd3a5eb687b76390a5f1f7db60 HomophoneReplacerConfig.kt
          86c963f27677f690eb0d6639735052eba5e60d9f81ccd4c1df0aa831fd680d6f QnnConfig.kt
          LIST
          # arm64 native libs from the official Android release (asset digest checked)
          curl -fsSL "$R/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2" -o "$T/android.tar.bz2"
          echo "39003753ec293425ed56723ea9b972b98841a490af3311670c3060548d654330  $T/android.tar.bz2" | sha256sum -c -
          tar -xjf "$T/android.tar.bz2" -C "$T" ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so ./jniLibs/arm64-v8a/libonnxruntime.so
          echo "5db8f89f12b2c900a98c9e01e00c475c59db35e9437a62e36e27839ec48b5575  $T/jniLibs/arm64-v8a/libsherpa-onnx-jni.so" | sha256sum -c -
          echo "33847ad43bffe204699fd4a27f7f3603452a8cdaf2f9a44983a0bc31ffcf2da1  $T/jniLibs/arm64-v8a/libonnxruntime.so" | sha256sum -c -
          mkdir -p "$M/jniLibs/arm64-v8a"
          cp "$T"/jniLibs/arm64-v8a/libsherpa-onnx-jni.so "$T"/jniLibs/arm64-v8a/libonnxruntime.so "$M/jniLibs/arm64-v8a/"
          # KWS model (int8 encoder/joiner, fp32 decoder) + its README for the notices
          curl -fsSL "$R/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2" -o "$T/kws.tar.bz2"
          echo "f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a  $T/kws.tar.bz2" | sha256sum -c -
          tar -xjf "$T/kws.tar.bz2" -C "$T"
          D="$T/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          mkdir -p "$M/assets/kws"
          for f in tokens.txt encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx decoder-epoch-12-avg-2-chunk-16-left-64.onnx joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx; do cp "$D/$f" "$M/assets/kws/$f"; done
          cp "$D/README.md" "$M/assets/kws/MODEL-README.md"
          ( cd "$M/assets/kws" && cat <<'SUMS' | sha256sum -c -
          fd2ded4050a55d2b1578870ba8697d02371980217806b7558bd0a5cc60f3ba53  tokens.txt
          1e721676515bcd42a186979733981213c66c80db680e1cc582dfedf3be76e678  encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx
          f61ebd3eed3773a44d088d53dfae92dbb6aec4839f4dcaee2d402414741663a3  decoder-epoch-12-avg-2-chunk-16-left-64.onnx
          eae9da0c7e1e6c6a3f4cc42d167899c388f6c6701b94cb96320e4f55df79624c  joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx
          74e42d37d63acd2366b042151d576fcc0c4917a41de339414a37f1e79f4e80e2  MODEL-README.md
          SUMS
          )

      - name: Fetch offline speech model (sha256-verified)
        if: matrix.variant == 'voice' || matrix.variant == 'voicesort'
        working-directory: prepared
        run: |
          curl -fsSL "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -o "$RUNNER_TEMP/vosk-model.zip"
          echo "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498  $RUNNER_TEMP/vosk-model.zip" | sha256sum -c -
          mkdir -p core/media/media3/src/main/assets/model-en-us
          unzip -q "$RUNNER_TEMP/vosk-model.zip" -d "$RUNNER_TEMP/vosk-model"
          cp -r "$RUNNER_TEMP/vosk-model/vosk-model-small-en-us-0.15/." core/media/media3/src/main/assets/model-en-us/
          # StorageService.unpack contract: marker file it uses to detect an already-unpacked model
          printf 'simpmusic-voice-en-us-1' > core/media/media3/src/main/assets/model-en-us/uuid

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle
      - name: Real Room migration, data regression and sync tests
        working-directory: prepared
        run: ./gradlew :data:jvmTest :loginSync:jvmTest --stacktrace
      - name: Media, 8D and voice unit tests
        working-directory: prepared
        run: ./gradlew :media3:testDebugUnitTest --stacktrace
      - name: Build optimized personal update
        working-directory: prepared
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        env:
          SIGN_STORE_FILE: ${{ runner.temp }}/voice-test.keystore
          SIGN_STORE_PASSWORD: ${{ secrets.VOICE_SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.VOICE_SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.VOICE_SIGN_KEY_PASSWORD }}
      - name: Verify exact APK identity, signature, model inclusion and release flags
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APK=$(find prepared/androidApp/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          test -n "$APK"
          mkdir -p deliver
          OUT="deliver/SimpMusic-2.6.0-${VARIANT}-arm64.apk"
          cp "$APK" "$OUT"
          "$BT/aapt" dump badging "$OUT" | tee deliver/identity.txt
          grep -q "package: name='com.maxrave.simpmusic.dev'" deliver/identity.txt
          if grep -q 'application-debuggable' deliver/identity.txt; then exit 1; fi
          unzip -l "$OUT" > deliver/zip-list.txt
          if [ "$VARIANT" = base ]; then
            grep -q "versionCode='66'" deliver/identity.txt
            if grep -q 'assets/kws/' deliver/zip-list.txt; then echo 'Unexpected voice model in base'; exit 1; fi
          elif [ "$VARIANT" = sort ]; then
            grep -q "versionCode='68'" deliver/identity.txt
            if grep -q 'assets/kws/' deliver/zip-list.txt; then echo 'Unexpected voice model in sort'; exit 1; fi
          elif [ "$VARIANT" = voicesort ]; then
            grep -q "versionCode='69'" deliver/identity.txt
            grep 'assets/kws/tokens.txt' deliver/zip-list.txt
            grep 'assets/model-en-us/uuid' deliver/zip-list.txt
          else
            grep -q "versionCode='67'" deliver/identity.txt
            grep 'assets/kws/tokens.txt' deliver/zip-list.txt
            grep 'assets/model-en-us/uuid' deliver/zip-list.txt
          fi
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee deliver/signature.txt
          grep -q '65e4f2d45b70c95b1ea21e647e52a0a9153b5f7723771db30ae54feb65388c9f' deliver/signature.txt
          unzip -t "$OUT" | tail -1
          sha256sum "$OUT" | tee deliver/SHA256SUMS.txt
          cp prepared/PERSONAL-UPDATE-NOTES.md deliver/
          # Full corresponding modified source and native/model assets, no signing key or credentials.
          tar --exclude='.git' --exclude='build' --exclude='.gradle' --exclude='.kotlin' -czf "deliver/SimpMusic-2.6.0-${VARIANT}-source.tar.gz" -C prepared .
          sha256sum "deliver/SimpMusic-2.6.0-${VARIANT}-source.tar.gz" >> deliver/SHA256SUMS.txt
      - name: Upload verified APK, source and test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simpmusic-260-${{ matrix.variant }}
          path: |
            deliver/
            prepared/core/data/build/reports/tests/
            prepared/core/media/media3/build/reports/tests/
            prepared/core/service/loginSync/build/reports/tests/
          retention-days: 7
