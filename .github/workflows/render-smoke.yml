name: TEMP render smoke check (sort update UI proof)

on:
  push:
    branches: [arhaan/liked-autosort]
    paths:
      - '.github/workflows/render-smoke.yml'
      - 'ci/render_smoke.py'
      - 'ci/smoke-run-id.txt'
      - 'ci/smoke-old-run-id.txt'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: 21
          distribution: microsoft

      - name: Read target build run ids
        run: |
          echo "SORT_RUN_ID=$(cat ci/smoke-run-id.txt)" >> "$GITHUB_ENV"
          echo "OLD_RUN_ID=$(cat ci/smoke-old-run-id.txt)" >> "$GITHUB_ENV"

      - name: Download the verified sort APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simpmusic-260-voicesort
          run-id: ${{ env.SORT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Download the prior voice67 APK artifact (upgrade source)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simpmusic-260-voice
          run-id: ${{ env.OLD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk-old

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Staged installed-app smoke check on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          script: python3 ci/render_smoke.py

      - name: Upload screenshots and stage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sort-ui-shots
          path: shots/
